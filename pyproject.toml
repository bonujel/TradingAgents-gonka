[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.2.5"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    # Floor is 1.2.0: tradingagents/graph/setup.py passes `retry_policy=`
    # to StateGraph.add_node, the kwarg name used on langgraph 1.x.
    # Older releases call it `retry` and reject `retry_policy`.
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
]

[project.optional-dependencies]
# Extras for the daily S&P 500 analysis app under app/. The base package
# stays slim for users who only need the TradingAgents library.
# gonka-openai signs every request with an ECDSA secp256k1 key; the
# wheel requires libsecp256k1 headers on Linux (apt install
# libsecp256k1-dev) unless installed inside a conda env where the
# wheel ships prebuilt.
app = [
    "apscheduler>=3.10.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gonka-openai>=0.2.6",
]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-app = "app.runner:_cli"
tradingagents-scheduler = "app.scheduler:start"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "app*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
